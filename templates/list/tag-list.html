{% extends "base.html" %}

{% block content %}
  <h1>Tag List
    <a href="{% url "list:tag-create" %}" class="btn btn-primary link-to-page ml-3">Add new tag</a>
  </h1>
  {% if tag_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.id }}</td>
          <td>{{ tag.name }}</td>
          <td><a href="{% url "list:tag-update" pk=tag.pk %}" class="btn btn-info btn-sm">Edit</a></td>
          <td><a href="{% url "list:tag-delete" pk=tag.pk %}" class="btn btn-danger btn-sm">DELETE</a></td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no tags in the service.</p>
  {% endif %}
{% endblock %}
