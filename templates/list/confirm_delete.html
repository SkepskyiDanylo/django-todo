{% extends "base.html" %}

{% block content %}
  <h1>Delete {{ model }}?</h1>
  <span><i class="text text-danger">You sure that you want to delete {{ model }} #{{ object.pk }}?</i></span>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" class="btn btn-danger mt-3">
  </form>
{% endblock %}
